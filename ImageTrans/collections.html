<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Image Collections</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0; background: #f5f6f8; color: #222;
      }
      header {
        position: sticky; top: 0; z-index: 10;
        background: #fff; border-bottom: 1px solid #ddd;
        padding: 12px 20px; display: flex; align-items: center; gap: 12px;
      }
      header h1 { font-size: 18px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .actions { display: flex; gap: 8px; }
      .actions button {
        padding: 6px 14px; border: 1px solid #ccc; background: #fff;
        border-radius: 6px; cursor: pointer; font-size: 13px;
      }
      .actions button:hover { background: #eee; }
      .hidden { display: none !important; }
      #content { padding: 20px; max-width: 1100px; margin: 0 auto; }
      .empty { text-align: center; color: #777; padding: 60px 20px; }

      /* List view */
      .collection-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
      .collection-card {
        background: #fff; border: 1px solid #ddd; border-radius: 8px;
        padding: 14px; cursor: pointer; transition: box-shadow .15s;
      }
      .collection-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.12); }
      .collection-card h3 { margin: 0 0 6px; font-size: 16px; word-break: break-all; }
      .collection-card .meta { font-size: 12px; color: #666; margin: 3px 0; display: flex; align-items: center; gap: 6px; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; color: #fff; }
      .badge.done { background: #2a9d4e; }
      .badge.translating { background: #e8890c; }
      .badge.stopped { background: #999; }
      .badge.failed { background: #c33; }
      .collection-actions { margin-top: 10px; }
      .collection-actions button {
        padding: 4px 12px; border: 1px solid #ccc; background: #fff;
        border-radius: 6px; cursor: pointer; font-size: 12px;
      }
      .collection-actions button.delete { color: #c33; border-color: #e0a0a0; }
      .collection-actions button.delete:hover { background: #fdecec; }

      /* Detail view */
      .page-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
      .page-head {
        padding: 8px 14px; background: #fafafa; border-bottom: 1px solid #eee;
        font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
      }
      .page-head .page-num { font-weight: 600; }
      .page-head .page-src { color: #888; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
      .page-head .page-actions button {
        padding: 3px 10px; border: 1px solid #ccc; background: #fff;
        border-radius: 5px; cursor: pointer; font-size: 12px;
      }
      .page-head .page-actions button:hover { background: #eee; }
      .imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #111; }
      .imgs figure { margin: 0; position: relative; background: #ddd; min-height: 60px; }
      .imgs img { width: 100%; height: auto; display: block; }
      .imgs figcaption {
        position: absolute; top: 6px; left: 6px; z-index: 1;
        background: rgba(0,0,0,.6); color: #fff; font-size: 11px;
        padding: 2px 8px; border-radius: 4px;
      }
      .boxes { padding: 10px 14px; border-top: 1px solid #eee; }
      .boxes .box { padding: 3px 0; font-size: 13px; word-break: break-word; }
      .boxes .box .src { color: #555; }
      .boxes .box .arrow { color: #999; margin: 0 6px; }
      .boxes .box .target { color: #111; font-weight: 500; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Image Collections</h1>
      <div class="actions">
        <button id="back-btn" class="hidden">Back</button>
        <button id="refresh-btn">Refresh</button>
      </div>
    </header>
    <main id="content"></main>
    <script src="collectionsDB.js"></script>
    <script src="collections.js"></script>
  </body>
</html>
