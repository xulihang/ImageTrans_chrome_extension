<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ImageTrans PaddleOCR sandbox</title>
</head>
<body>
<!--
  Hosts the OCR stack (OpenCV + ONNX Runtime + PaddleOCR) for pages that can't
  run it themselves.

  The stack is normally injected into the host page's main world, where the
  page's CSP applies — and sites like MangaDex send `script-src 'strict-dynamic'
  'nonce-...'` with Trusted Types, which blocks both the WebAssembly compile that
  OpenCV/ORT need and the `new Function()` emscripten uses to build error
  objects. This page is listed under the manifest's `sandbox.pages`, so the
  browser serves it with the sandbox CSP and a unique origin: dynamic code and
  WebAssembly keep working, and the host page's CSP no longer applies.

  The trade-offs of the unique origin: no extension APIs and no access to the
  embedder's DOM. Everything therefore goes over postMessage — the content
  script injects this page in a hidden iframe and drives it the same way it used
  to drive the injected scripts. Everything here is loaded from sandbox.js, so
  the page needs no inline script; the protocol itself lives in page-ocr.js,
  which is unaware of where it runs.
-->
<script src="sandbox.js"></script>
</body>
</html>
